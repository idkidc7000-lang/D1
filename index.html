<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#18202a;
    color:white;
    font-family:Arial;
}

#menu{
    position:absolute;
    left:0;
    top:0;
    right:0;
    bottom:0;
    background:#10151c;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:400px;
    background:#222b38;
    padding:25px;
    box-sizing:border-box;
    border-radius:15px;
    text-align:center;
}

input{
    width:100%;
    padding:15px;
    box-sizing:border-box;
    font-size:18px;
    border-radius:8px;
    border:0;
    margin:8px 0;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    font-size:20px;
    border:0;
    border-radius:8px;
    background:#4285f4;
    color:white;
}

#game{
    display:none;
    width:100%;
    height:100%;
}

#controls{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    width:180px;
    height:140px;
    display:none;
}

.control{
    position:absolute;
    width:55px;
    height:55px;
    padding:0;
    margin:0;
    font-size:28px;
    background:#4285f4;
    opacity:0.85;
}

#up{
    left:62px;
    top:0;
}

#down{
    left:62px;
    bottom:0;
}

#left{
    left:0;
    top:62px;
}

#right{
    right:0;
    top:62px;
}
</style>
</head>

<body>

<div id="menu">

<div class="box">

<h1>MINI WORLD</h1>

<p>Enter the server address:</p>

<input
    id="serverAddress"
    value="192.168.178.33:8080"
    type="text"
>

<button onclick="joinGame()">JOIN GAME</button>

<div id="info"></div>

</div>
</div>

<canvas id="game"></canvas>

<div id="controls">

<button class="control" id="up">▲</button>
<button class="control" id="down">▼</button>
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>

</div>

<script>

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var menu = document.getElementById("menu");
var info = document.getElementById("info");
var controls = document.getElementById("controls");

var socket = null;

var players = {};

var myId =
    "Player" +
    Math.floor(Math.random() * 99999);

var myX = 0;
var myY = 0;

var keys = {};

var playing = false;


/* JOIN GAME */

function joinGame(){

    var address =
        document.getElementById("serverAddress").value.trim();

    if(!address){
        info.innerHTML =
            "Please enter the server address.";
        return;
    }

    info.innerHTML =
        "Connecting...";

    try{

        socket =
            new WebSocket("ws://" + address);

        socket.onopen = function(){

            socket.send(
                JSON.stringify({
                    type:"join",
                    id:myId
                })
            );

            playing = true;

            menu.style.display = "none";

            canvas.style.display = "block";

            controls.style.display = "block";

            resize();
        };


        socket.onmessage = function(event){

            try{

                var data =
                    JSON.parse(event.data);

                if(data.type === "state"){

                    players =
                        data.players;

                }

            }catch(e){}

        };


        socket.onclose = function(){

            playing = false;

            menu.style.display = "flex";

            canvas.style.display = "none";

            controls.style.display = "none";

            info.innerHTML =
                "<b>Disconnected</b><br><br>" +
                "The server stopped.";

        };

    }catch(e){

        info.innerHTML =
            "Could not connect.";

    }

}


/* KEYBOARD */

document.onkeydown = function(e){

    keys[e.key.toLowerCase()] = true;

};

document.onkeyup = function(e){

    keys[e.key.toLowerCase()] = false;

};


/* TOUCH CONTROLS */

function holdKey(key){

    keys[key] = true;

}

function releaseKey(key){

    keys[key] = false;

}


/* BUTTON SETUP */

function setupButton(id,key){

    var button =
        document.getElementById(id);


    button.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            holdKey(key);

        }
    );


    button.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            releaseKey(key);

        }
    );


    button.addEventListener(
        "touchcancel",
        function(e){

            e.preventDefault();

            releaseKey(key);

        }
    );


    button.addEventListener(
        "mousedown",
        function(){

            holdKey(key);

        }
    );


    button.addEventListener(
        "mouseup",
        function(){

            releaseKey(key);

        }
    );


    button.addEventListener(
        "mouseleave",
        function(){

            releaseKey(key);

        }
    );

}


setupButton("up","w");
setupButton("down","s");
setupButton("left","a");
setupButton("right","d");


/* SEND MOVEMENT */

setInterval(function(){

    if(!playing){
        return;
    }

    if(keys["w"] ||
       keys["arrowup"]){

        myY -= 4;

    }

    if(keys["s"] ||
       keys["arrowdown"]){

        myY += 4;

    }

    if(keys["a"] ||
       keys["arrowleft"]){

        myX -= 4;

    }

    if(keys["d"] ||
       keys["arrowright"]){

        myX += 4;

    }


    if(socket &&
       socket.readyState === 1){

        socket.send(
            JSON.stringify({
                type:"move",
                x:myX,
                y:myY
            })
        );

    }

},30);


/* RESIZE */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.onresize = resize;


/* DRAW GAME */

function draw(){

    if(!playing){

        requestAnimationFrame(draw);

        return;

    }


    ctx.fillStyle =
        "#18202a";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
        "#293747";


    var x;
    var y;


    for(
        x=-2000;
        x<2000;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2+x,
            0
        );

        ctx.lineTo(
            canvas.width/2+x,
            canvas.height
        );

        ctx.stroke();

    }


    for(
        y=-2000;
        y<2000;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(
            0,
            canvas.height/2+y
        );

        ctx.lineTo(
            canvas.width,
            canvas.height/2+y
        );

        ctx.stroke();

    }


    /* PLAYERS */

    for(var id in players){

        var p =
            players[id];

        var px =
            canvas.width/2 + p.x;

        var py =
            canvas.height/2 + p.y;


        ctx.beginPath();

        ctx.arc(
            px,
            py,
            18,
            0,
            Math.PI*2
        );


        if(id === myId){

            ctx.fillStyle =
                "#55a0ff";

        }else{

            ctx.fillStyle =
                "#ffb84d";

        }


        ctx.fill();


        ctx.fillStyle =
            "white";

        ctx.font =
            "14px Arial";

        ctx.textAlign =
            "center";


        ctx.fillText(
            id,
            px,
            py-25
        );

    }


    requestAnimationFrame(draw);

}


resize();

draw();

</script>

</body>
</html>
