<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dyon Remote Dash</title>
<style>
html,body{margin:0;height:100%;background:#080b1d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;display:grid;place-items:center}
canvas{width:100%;height:100%;background:linear-gradient(#111b46,#2a1247)}
#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:clamp(15px,2.4vw,28px);font-weight:bold;text-shadow:2px 2px #000;pointer-events:none}
#panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,600px);padding:25px;text-align:center;background:#0b1028ee;border:3px solid #6ee7ff;border-radius:16px}
#panel h1{font-size:clamp(28px,5vw,58px);margin:0 0 12px}
#panel p{font-size:clamp(16px,2.3vw,24px);line-height:1.45}
.key{display:inline-block;padding:3px 8px;border:2px solid #fff;border-radius:6px;background:#31395d}
.hide{display:none}
#hint{position:absolute;bottom:10px;width:100%;text-align:center;font-size:clamp(11px,1.5vw,17px);pointer-events:none}
#waveIndicator{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 18px;border:3px solid #6ee7ff;border-radius:12px;background:#081021dd;color:#6ee7ff;font-size:clamp(14px,2.5vw,28px);font-weight:bold;text-shadow:2px 2px #000;display:none;pointer-events:none}
#jumpButton{position:absolute;right:24px;bottom:48px;z-index:5;font-size:clamp(22px,4vw,48px);font-weight:bold;color:#081021;background:#ffe45e;border:4px solid #fff;border-radius:18px;padding:18px 34px;box-shadow:0 0 0 4px #6ee7ff;cursor:pointer}
#jumpButton:focus{outline:6px solid #ff416c;outline-offset:5px}
</style>
</head>
<body>

<div id="wrap">
<canvas id="game" width="1280" height="720"></canvas>

<div id="hud">
<span id="score">Score: 0</span>
<span id="progress">0%</span>
<span id="state">READY</span>
</div>

<div id="panel">
<h1 id="title">REMOTE DASH</h1>
<p id="message">
Press <span class="key">OK/LIST</span> to start or jump.<br>
Use the <span class="key">↑</span> arrow for jump too.<br>
<span class="key">BACK</span> pauses; <span class="key">EXIT</span> pauses.
</p>
</div>

<div id="waveIndicator">🌊 WAVE SECTION</div>

<button id="jumpButton" type="button" tabindex="0">JUMP</button>

<div id="hint">
Move the cursor onto JUMP and press OK • ↑ = jump • BACK/EXIT = pause
</div>
</div>

<script>
(function(){

var c=document.getElementById('game');
var x=c.getContext('2d');
var W=1280,H=720;

var panel=document.getElementById('panel');
var title=document.getElementById('title');
var message=document.getElementById('message');
var score=document.getElementById('score');
var progress=document.getElementById('progress');
var stateText=document.getElementById('state');
var jumpButton=document.getElementById('jumpButton');
var waveIndicator=document.getElementById('waveIndicator');

var state='menu';
var world=0;
var rot=0;
var last=0;

var p={
x:190,
y:570,
w:42,
h:42,
vy:0,
ground:true
};

var floor=612;
var gravity=.78;
var jump=-14;
var speed=7;

var waveStart=6000;
var waveEnd=9000;
var waveMode=false;

/* SPIKES ARE MORE SPACED OUT */
var spikes=[];

for(var i=0;i<24;i++){
spikes.push({
x:700+i*460,
h:65
});
}

function show(t,m){
title.innerHTML=t;
message.innerHTML=m;
panel.className='';
}

function hide(){
panel.className='hide';
}

function reset(){
world=0;
rot=0;

p={
x:190,
y:570,
w:42,
h:42,
vy:0,
ground:true
};

state='playing';
stateText.innerHTML='PLAYING';
hide();
}

function pause(){
if(state==='playing'){
state='paused';
stateText.innerHTML='PAUSED';
show('PAUSED','Press <span class="key">OK/LIST</span> to continue');
}
else if(state==='paused'){
state='playing';
stateText.innerHTML='PLAYING';
hide();
}
}

function action(){

if(state==='menu'||state==='dead'||state==='win'){
reset();
return;
}

if(state==='paused'){
pause();
return;
}

if(state==='playing'){

if(waveMode){

/* WAVE CONTROL */
p.vy=p.vy<0?5:-5;

}
else if(p.ground){

p.vy=jump;
p.ground=false;

}

}

}

jumpButton.addEventListener('click',function(e){
e.preventDefault();
action();
},false);

jumpButton.addEventListener('keydown',function(e){

var n=e.keyCode||e.which;
var k=(e.key||'').toLowerCase();

if(n===13||n===32||k==='enter'||k===' '){
e.preventDefault();
action();
}

},false);

function dead(){

state='dead';
stateText.innerHTML='DEAD';

show(
'💀 GAME OVER',
'Press <span class="key">OK/LIST</span> to retry'
);

}

function key(e){

var k=(e.key||'').toLowerCase();
var n=e.keyCode||e.which;

var jumpKey=
k==='enter'||
k===' '||
k==='arrowup'||
k==='ok'||
k==='select'||
n===13||
n===32||
n===38;

var backKey=
k==='escape'||
k==='back'||
k==='exit'||
n===27||
n===8||
n===461;

if(jumpKey){
e.preventDefault();
action();
return;
}

if(backKey){
e.preventDefault();
pause();
return;
}

}

window.addEventListener('keydown',key,false);
document.addEventListener('keydown',key,false);

function hit(a,b){

return a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y;

}

function update(dt){

if(state!=='playing')return;

world+=speed*dt;
rot+=.08*dt;

/* WAVE SECTION: 50% TO 75% */
waveMode=world>=waveStart&&world<waveEnd;

stateText.innerHTML=waveMode?'WAVE':'PLAYING';

/* SHOW WAVE INDICATOR */
waveIndicator.style.display=waveMode?'block':'none';

if(waveMode){

p.y+=p.vy*dt;

if(p.y<70){
p.y=70;
p.vy=5;
}

if(p.y+p.h>floor-35){
p.y=floor-35-p.h;
p.vy=-5;
}

}
else{

p.vy+=gravity*dt;
p.y+=p.vy*dt;

if(p.y+p.h>=floor){

p.y=floor-p.h;
p.vy=0;
p.ground=true;

}
else{

p.ground=false;

}

}

/* COLLISION CHECK */
for(var i=0;i<spikes.length;i++){

var s=spikes[i];

var sx=s.x-world+p.x;

var o={
x:sx,
y:floor-s.h,
w:48,
h:s.h
};

if(hit(p,o)){
dead();
return;
}

/* TOP SPIKES DURING WAVE */
if(waveMode&&sx>300&&sx<900){

var top={
x:sx,
y:70,
w:48,
h:65
};

if(hit(p,top)){
dead();
return;
}

}

}

if(world>=12000){

state='win';
stateText.innerHTML='100%';

show(
'🏆 100% COMPLETE',
'Press <span class="key">OK/LIST</span> to play again'
);

}

score.innerHTML='Score: '+Math.floor(world/10);

progress.innerHTML=
Math.min(100,Math.floor(world/120))+'%';

}

function draw(){

x.clearRect(0,0,W,H);

/* GRID */
x.strokeStyle='rgba(110,231,255,.16)';
x.lineWidth=2;

for(var i=-((world*.3)%80);i<W;i+=80){

x.beginPath();
x.moveTo(i,0);
x.lineTo(i,H);
x.stroke();

}

/* FLOOR */
x.fillStyle='#151a38';
x.fillRect(0,floor,W,H-floor);

/* WAVE BACKGROUND */
if(waveMode){

x.fillStyle='rgba(110,231,255,.12)';
x.fillRect(0,70,W,floor-105);

x.fillStyle='#6ee7ff';
x.font='bold 34px Arial';
x.fillText('WAVE SECTION',470,120);

}

/* FLOOR LINE */
x.strokeStyle='#6ee7ff';
x.lineWidth=5;

x.beginPath();
x.moveTo(0,floor);
x.lineTo(W,floor);
x.stroke();

/* SPIKES */
for(var i=0;i<spikes.length;i++){

var s=spikes[i];

var sx=s.x-world+p.x;

if(sx<-80||sx>W+80)continue;

var sy=floor-s.h;

x.fillStyle='#ff416c';

x.beginPath();
x.moveTo(sx,floor);
x.lineTo(sx+24,sy);
x.lineTo(sx+48,floor);
x.closePath();
x.fill();

/* TOP SPIKES IN WAVE MODE */
if(waveMode){

x.beginPath();
x.moveTo(sx,70);
x.lineTo(sx+24,135);
x.lineTo(sx+48,70);
x.closePath();
x.fill();

}

}

/* CUBE */
x.save();

x.translate(
p.x+p.w/2,
p.y+p.h/2
);

x.rotate(rot);

x.fillStyle='#ffe45e';
x.fillRect(-21,-21,42,42);

x.strokeStyle='#fff';
x.lineWidth=3;
x.strokeRect(-21,-21,42,42);

x.restore();

}

function loop(t){

var dt=Math.min(2,(t-last)/16.67||1);

last=t;

update(dt);
draw();

if(window.requestAnimationFrame){

window.requestAnimationFrame(loop);

}
else{

setTimeout(function(){
loop(new Date().getTime());
},16);

}

}

if(window.requestAnimationFrame){

window.requestAnimationFrame(loop);

}
else{

loop(new Date().getTime());

}

})();
</script>
</body>
</html>
