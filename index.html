<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blocky Tree World 3D</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#8bd5ff;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100vw;
  height:100vh;
  image-rendering:pixelated;
}

#ui{
  position:fixed;
  inset:0;
  pointer-events:none;
}

button{
  pointer-events:auto;
  border:2px solid #ffffffaa;
  background:#263b2be8;
  color:white;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
}

#pad{
  position:absolute;
  left:18px;
  bottom:18px;
  width:170px;
  height:170px;
}

#pad button{
  position:absolute;
  width:58px;
  height:58px;
}

#up{
  left:56px;
  top:0;
}

#left{
  left:0;
  top:56px;
}

#down{
  left:56px;
  top:112px;
}

#right{
  left:112px;
  top:56px;
}

#look{
  position:absolute;
  right:18px;
  bottom:145px;
  width:190px;
  height:64px;
  display:flex;
  gap:8px;
  justify-content:flex-end;
}

#look button{
  width:84px;
  height:56px;
}

#actions{
  position:absolute;
  right:18px;
  bottom:25px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  width:190px;
  justify-content:flex-end;
}

#actions button{
  width:84px;
  height:56px;
}

#info{
  position:absolute;
  top:10px;
  left:10px;
  color:#fff;
  text-shadow:2px 2px #000;
  font-size:12px;
}

#hint{
  position:absolute;
  top:28px;
  left:10px;
  color:#fff;
  text-shadow:2px 2px #000;
  font-size:11px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

  <div id="info">BLOCKY TREE WORLD</div>

  <div id="hint">
    Use LOOK buttons to turn • BREAK removes a tree block
  </div>

  <!-- Movement controls -->
  <div id="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>

  <!-- Separate look controls -->
  <div id="look">
    <button id="lookLeft">LOOK ◀</button>
    <button id="lookRight">LOOK ▶</button>
  </div>

  <!-- Action controls -->
  <div id="actions">
    <button id="jump">FORWARD</button>
    <button id="break">BREAK</button>
    <button id="reset">RESET</button>
  </div>

</div>

<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const RW = 320;
const RH = 180;

canvas.width = RW;
canvas.height = RH;

const W = 24;
const H = 24;

let px = 8.5;
let py = 13.5;
let ang = -Math.PI / 2;

let move = {};
let removed = new Set();

const trees = [
  [4,5],
  [10,4],
  [17,5],
  [20,10],
  [5,15],
  [13,17],
  [19,18],
  [9,21],
  [3,10]
];

function key(x,y){
  return x + ',' + y;
}

function treeAt(x,y){
  return trees.some(t => t[0] === x && t[1] === y);
}

function trunkAt(x,y){
  return treeAt(x,y) && !removed.has(key(x,y));
}

function leafAt(x,y){

  if(removed.has(key(x,y))){
    return false;
  }

  for(const [tx,ty] of trees){

    for(let dx = -1; dx <= 1; dx++){
      for(let dy = -1; dy <= 1; dy++){

        if(
          x === tx + dx &&
          y === ty + dy &&
          !removed.has(key(x,y))
        ){
          return true;
        }

      }
    }

    if(
      x === tx &&
      y === ty - 2 &&
      !removed.has(key(x,y))
    ){
      return true;
    }

  }

  return false;
}

function solid(x,y){

  if(
    x < 0 ||
    y < 0 ||
    x >= W ||
    y >= H
  ){
    return true;
  }

  return trunkAt(x,y) || leafAt(x,y);
}

function bind(id,k){

  const el = document.getElementById(id);

  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    move[k] = 1;
  });

  [
    'pointerup',
    'pointercancel',
    'pointerleave'
  ].forEach(type => {

    el.addEventListener(type, () => {
      move[k] = 0;
    });

  });

}

bind('up','f');
bind('down','b');
bind('left','l');
bind('right','r');

bind('lookLeft','lookL');
bind('lookRight','lookR');


// Optional drag-to-look
let lookPointer = null;
let lastX = 0;

canvas.addEventListener('pointerdown', e => {

  lookPointer = e.pointerId;
  lastX = e.clientX;

  canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener('pointermove', e => {

  if(lookPointer !== e.pointerId){
    return;
  }

  const dx = e.clientX - lastX;

  lastX = e.clientX;

  ang += dx * 0.012;

});

canvas.addEventListener('pointerup', e => {

  if(e.pointerId === lookPointer){
    lookPointer = null;
  }

});

canvas.addEventListener('pointercancel', e => {

  if(e.pointerId === lookPointer){
    lookPointer = null;
  }

});


// Move forward button
function moveForward(amount){

  const nx = px + Math.cos(ang) * amount;
  const ny = py + Math.sin(ang) * amount;

  if(
    !solid(
      Math.floor(nx),
      Math.floor(ny)
    )
  ){

    px = nx;
    py = ny;

  }

}

document.getElementById('jump').onclick = () => {
  moveForward(0.45);
};


// Reset the world
document.getElementById('reset').onclick = () => {

  px = 8.5;
  py = 13.5;
  ang = -Math.PI / 2;

  removed.clear();

};


// Break nearby tree blocks
document.getElementById('break').onclick = () => {

  for(let d = 0.8; d <= 3; d += 0.12){

    const x = Math.floor(
      px + Math.cos(ang) * d
    );

    const y = Math.floor(
      py + Math.sin(ang) * d
    );

    if(
      trunkAt(x,y) ||
      leafAt(x,y)
    ){

      removed.add(key(x,y));
      break;

    }

  }

};


// Update movement
function update(){

  const s = 0.05;

  let dx = 0;
  let dy = 0;

  if(move.f){

    dx += Math.cos(ang) * s;
    dy += Math.sin(ang) * s;

  }

  if(move.b){

    dx -= Math.cos(ang) * s;
    dy -= Math.sin(ang) * s;

  }

  // Movement turning
  if(move.l){
    ang -= 0.055;
  }

  if(move.r){
    ang += 0.055;
  }

  // Separate looking controls
  if(move.lookL){
    ang -= 0.065;
  }

  if(move.lookR){
    ang += 0.065;
  }

  // Collision detection
  if(
    !solid(
      Math.floor(px + dx),
      Math.floor(py)
    )
  ){

    px += dx;

  }

  if(
    !solid(
      Math.floor(px),
      Math.floor(py + dy)
    )
  ){

    py += dy;

  }

}


// Render lightweight 3D
function render(){

  // Sky gradient
  const sky = ctx.createLinearGradient(
    0,
    0,
    0,
    RH / 2
  );

  sky.addColorStop(0,'#78cfff');
  sky.addColorStop(1,'#d8f5ff');

  ctx.fillStyle = sky;
  ctx.fillRect(
    0,
    0,
    RW,
    RH / 2
  );

  // Green baseplate
  ctx.fillStyle = '#70b94e';

  ctx.fillRect(
    0,
    RH / 2,
    RW,
    RH / 2
  );

  const fov = Math.PI / 3;

  // Raycasting
  for(let x = 0; x < RW; x++){

    const ra =
      ang -
      fov / 2 +
      fov * x / RW;

    const rx = Math.cos(ra);
    const ry = Math.sin(ra);

    let d = 0;
    let kind = 0;

    while(d < 28){

      d += 0.035;

      const gx = Math.floor(
        px + rx * d
      );

      const gy = Math.floor(
        py + ry * d
      );

      if(
        gx < 0 ||
        gy < 0 ||
        gx >= W ||
        gy >= H
      ){

        kind = 1;
        break;

      }

      if(trunkAt(gx,gy)){

        kind = 2;
        break;

      }

      if(leafAt(gx,gy)){

        kind = 3;
        break;

      }

    }

    if(kind){

      const corrected = Math.max(
        0.12,
        d * Math.cos(ra - ang)
      );

      const h = Math.min(
        RH * 1.5,
        RH / (corrected + 0.01) * 0.55
      );

      let r = 112;
      let g = 180;
      let b = 70;

      // Brown tree trunk
      if(kind === 2){

        r = 126;
        g = 78;
        b = 38;

      }

      // Green tree leaves
      if(kind === 3){

        r = 43;
        g = 145;
        b = 48;

      }

      const shade = Math.max(
        0.35,
        1 - corrected * 0.025
      );

      ctx.fillStyle =
        'rgb(' +
        Math.floor(r * shade) + ',' +
        Math.floor(g * shade) + ',' +
        Math.floor(b * shade) +
        ')';

      ctx.fillRect(
        x,
        (RH - h) / 2,
        1,
        Math.ceil(h)
      );

    }

  }

  // Crosshair
  ctx.fillStyle = '#fff';

  ctx.fillRect(
    RW / 2 - 4,
    RH / 2,
    8,
    1
  );

  ctx.fillRect(
    RW / 2,
    RH / 2 - 4,
    1,
    8
  );

}


// Game loop
function loop(){

  update();
  render();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
