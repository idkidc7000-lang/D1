<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotdog Clicker - Mobile</title>

<style>
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#fff1c7;
  font-family:Arial,sans-serif;
  color:#4b2414;
  text-align:center;
}

body{
  padding-bottom:20px;
}

#game{
  max-width:520px;
  margin:0 auto;
  padding:12px;
  box-sizing:border-box;
}

h1{
  font-size:28px;
  margin:8px 0;
}

#score{
  background:#fff;
  border:3px solid #d58a36;
  border-radius:12px;
  padding:10px;
  font-size:22px;
  font-weight:bold;
}

#hotdog{
  display:block;
  margin:22px auto 15px;
  width:260px;
  height:150px;
  border:0;
  background:transparent;
  cursor:pointer;
  touch-action:manipulation;
}

#hotdog:active{
  transform:scale(.94);
}

.bun{
  position:relative;
  width:230px;
  height:82px;
  margin:30px auto 0;
  background:#d58a35;
  border:7px solid #a95b25;
  border-radius:70px 70px 35px 35px;
  box-sizing:border-box;
}

.sausage{
  position:absolute;
  left:8px;
  top:25px;
  width:200px;
  height:32px;
  background:#bd3d25;
  border:5px solid #8c291c;
  border-radius:25px;
}

.mustard{
  position:absolute;
  left:25px;
  top:10px;
  width:175px;
  height:8px;
  background:#ffd83d;
  border-radius:10px;
  transform:rotate(-7deg);
}

#message{
  height:24px;
  font-weight:bold;
}

.panel{
  background:#fff;
  border:2px solid #e0a04e;
  border-radius:12px;
  padding:10px;
  margin:10px 0;
}

button.action{
  width:100%;
  min-height:48px;
  margin:5px 0;
  border:2px solid #7b431e;
  border-radius:10px;
  background:#f4bd56;
  color:#4b2414;
  font-size:17px;
  font-weight:bold;
}

button.action:disabled{
  opacity:.45;
}

.small{
  font-size:13px;
}
</style>
</head>

<body>

<div id="game">

  <h1>🌭 HOTDOG CLICKER 🌭</h1>

  <div id="score">

    Hotdogs:
    <span id="count">0</span>

    <br>

    <span class="small">

      Per click:
      <span id="power">1</span>

      • Auto/sec:
      <span id="auto">0</span>

    </span>

  </div>


  <!-- Clickable hotdog -->

  <button id="hotdog" aria-label="Click the hotdog">

    <div class="bun">

      <div class="sausage"></div>

      <div class="mustard"></div>

    </div>

  </button>


  <div id="message">
    Tap the hotdog!
  </div>


  <!-- Upgrades -->

  <div class="panel">

    <h2>Upgrades</h2>

    <button class="action" id="buyPower">

      🍅 Bigger Bite —
      Cost: <span id="powerCost">25</span>

    </button>


    <button class="action" id="buyAuto">

      🤖 Hotdog Machine —
      Cost: <span id="autoCost">100</span>

    </button>

  </div>


  <!-- Save and reset -->

  <div class="panel">

    <button class="action" id="save">
      💾 SAVE GAME
    </button>

    <button class="action" id="reset">
      🔄 RESET GAME
    </button>

    <div class="small">

      Works offline.
      Uses older-style JavaScript for older browsers.

    </div>

  </div>

</div>


<script type="text/javascript">

(function(){

var count = 0;
var power = 1;
var auto = 0;

var powerCost = 25;
var autoCost = 100;


var countEl =
  document.getElementById("count");

var powerEl =
  document.getElementById("power");

var autoEl =
  document.getElementById("auto");

var powerCostEl =
  document.getElementById("powerCost");

var autoCostEl =
  document.getElementById("autoCost");

var messageEl =
  document.getElementById("message");

var powerButton =
  document.getElementById("buyPower");

var autoButton =
  document.getElementById("buyAuto");


// Update the screen

function update(){

  countEl.innerHTML = Math.floor(count);

  powerEl.innerHTML = power;

  autoEl.innerHTML = auto;

  powerCostEl.innerHTML = powerCost;

  autoCostEl.innerHTML = autoCost;


  powerButton.disabled =
    count < powerCost;

  autoButton.disabled =
    count < autoCost;

}


// Show a message

function say(text){

  messageEl.innerHTML = text;

}


// Click the hotdog

function clickHotdog(){

  count = count + power;

  say(
    "YUM! +" +
    power +
    " hotdog(s) 🌭"
  );

  update();

}


// Buy bigger bites

function buyPower(){

  if(count >= powerCost){

    count = count - powerCost;

    power = power + 1;

    powerCost =
      Math.floor(powerCost * 1.7);

    say(
      "Your bites got bigger! 🍅"
    );

    update();

  }

}


// Buy automatic hotdogs

function buyAuto(){

  if(count >= autoCost){

    count = count - autoCost;

    auto = auto + 1;

    autoCost =
      Math.floor(autoCost * 2);

    say(
      "A hotdog machine joined you! 🤖"
    );

    update();

  }

}


// Save the game

function saveGame(){

  try{

    localStorage.setItem(
      "hotdogClickerSave",

      count + "|" +
      power + "|" +
      auto + "|" +
      powerCost + "|" +
      autoCost
    );

    say("Game saved! 💾");

  }catch(e){

    say(
      "Saving is not supported on this browser."
    );

  }

}


// Load the saved game

function loadGame(){

  try{

    var saved =
      localStorage.getItem(
        "hotdogClickerSave"
      );

    if(saved){

      var parts =
        saved.split("|");

      if(parts.length === 5){

        count =
          parseFloat(parts[0]) || 0;

        power =
          parseInt(parts[1],10) || 1;

        auto =
          parseInt(parts[2],10) || 0;

        powerCost =
          parseInt(parts[3],10) || 25;

        autoCost =
          parseInt(parts[4],10) || 100;

      }

    }

  }catch(e){}

}


// Reset the game

function resetGame(){

  if(window.confirm(
    "Reset all hotdogs?"
  )){

    count = 0;

    power = 1;

    auto = 0;

    powerCost = 25;

    autoCost = 100;


    try{

      localStorage.removeItem(
        "hotdogClickerSave"
      );

    }catch(e){}


    say("Fresh start! 🌭");

    update();

  }

}


// Connect buttons

document.getElementById(
  "hotdog"
).onclick = clickHotdog;


// Touch support for mobile

document.getElementById(
  "hotdog"
).ontouchstart = function(e){

  e.preventDefault();

  clickHotdog();

};


document.getElementById(
  "buyPower"
).onclick = buyPower;


document.getElementById(
  "buyAuto"
).onclick = buyAuto;


document.getElementById(
  "save"
).onclick = saveGame;


document.getElementById(
  "reset"
).onclick = resetGame;


// Automatic hotdogs every second

setInterval(function(){

  if(auto > 0){

    count = count + auto;

    update();

  }

},1000);


// Start the game

loadGame();

update();

})();

</script>

</body>
</html>
