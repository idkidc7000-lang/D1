<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#18202a;
    color:white;
    font-family:Arial
}

#menu{
    position:absolute;
    left:0;
    top:0;
    right:0;
    bottom:0;
    background:#10151c;
    display:flex;
    justify-content:center;
    align-items:center
}

.box{
    width:90%;
    max-width:420px;
    background:#222b38;
    padding:25px;
    box-sizing:border-box;
    border-radius:15px;
    text-align:center
}

input,button{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin:7px 0;
    font-size:18px;
    border-radius:8px;
    border:0
}

input{
    background:#111820;
    color:white;
    border:1px solid #667
}

button{
    background:#4285f4;
    color:white
}

#game{
    display:none;
    width:100%;
    height:100%
}

#info{
    margin-top:10px;
    padding:12px;
    background:#111820;
    border-radius:8px;
    word-break:break-all
}
</style>
</head>

<body>

<div id="menu">
<div class="box">

<h1>MINI WORLD</h1>

<p>Enter the address of the P50 server.</p>

<input id="server" placeholder="192.168.1.25:8080">

<button onclick="join()">JOIN GAME</button>

<div id="info">
Example: 192.168.1.25:8080
</div>

</div>
</div>

<canvas id="game"></canvas>

<script>

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");

var menu=document.getElementById("menu");
var info=document.getElementById("info");

var socket=null;

var players={};

var myId="Player"+Math.floor(Math.random()*99999);

var myX=0;
var myY=0;

var keys={};

var playing=false;


function join(){

    var address=
        document.getElementById("server").value;

    if(!address){

        info.innerHTML=
            "Please enter the P50 server address.";

        return;
    }

    info.innerHTML=
        "Connecting...";


    try{

        socket=new WebSocket(
            "ws://"+address
        );


        socket.onopen=function(){

            socket.send(
                JSON.stringify({
                    type:"join",
                    id:myId
                })
            );

            playing=true;

            menu.style.display="none";

            canvas.style.display="block";

            resize();

        };


        socket.onmessage=function(e){

            try{

                var data=
                    JSON.parse(e.data);

                if(data.type==="state"){

                    players=
                        data.players;

                }

            }catch(x){}

        };


        socket.onerror=function(){

            info.innerHTML=
                "Could not connect. Check the address and Wi-Fi.";

        };


        socket.onclose=function(){

            playing=false;

            menu.style.display="flex";

            canvas.style.display="none";

            info.innerHTML=
                "Disconnected from server.";

        };

    }catch(x){

        info.innerHTML=
            "This browser cannot use WebSockets.";

    }

}


document.onkeydown=function(e){

    keys[
        e.key.toLowerCase()
    ]=true;

};


document.onkeyup=function(e){

    keys[
        e.key.toLowerCase()
    ]=false;

};


setInterval(function(){

    if(
        !playing ||
        !socket ||
        socket.readyState!==1
    ){

        return;

    }


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        myY-=4;

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        myY+=4;

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        myX-=4;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        myX+=4;

    }


    socket.send(
        JSON.stringify({
            type:"move",
            x:myX,
            y:myY
        })
    );

},30);


function resize(){

    canvas.width=
        window.innerWidth;

    canvas.height=
        window.innerHeight;

}


window.onresize=resize;


function draw(){

    if(playing){

        ctx.fillStyle="#18202a";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.strokeStyle="#293747";

        var x;
        var y;


        for(
            x=-2000;
            x<2000;
            x+=50
        ){

            ctx.beginPath();

            ctx.moveTo(
                canvas.width/2+x,
                0
            );

            ctx.lineTo(
                canvas.width/2+x,
                canvas.height
            );

            ctx.stroke();

        }


        for(
            y=-2000;
            y<2000;
            y+=50
        ){

            ctx.beginPath();

            ctx.moveTo(
                0,
                canvas.height/2+y
            );

            ctx.lineTo(
                canvas.width,
                canvas.height/2+y
            );

            ctx.stroke();

        }


        for(var id in players){

            var p=players[id];

            var px=
                canvas.width/2+p.x;

            var py=
                canvas.height/2+p.y;


            ctx.beginPath();

            ctx.arc(
                px,
                py,
                18,
                0,
                Math.PI*2
            );


            ctx.fillStyle=
                (id===myId)
                ? "#55a0ff"
                : "#ffb84d";

            ctx.fill();


            ctx.fillStyle="white";

            ctx.font="14px Arial";

            ctx.textAlign="center";

            ctx.fillText(
                id,
                px,
                py-25
            );

        }

    }


    requestAnimationFrame(draw);

}


resize();

draw();

</script>

</body>
</html>
