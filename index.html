<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#18202a;
    color:white;
    font-family:Arial;
    touch-action:none
}

#menu{
    position:absolute;
    left:0;
    top:0;
    right:0;
    bottom:0;
    background:#10151c;
    display:flex;
    justify-content:center;
    align-items:center
}

.box{
    width:90%;
    max-width:420px;
    background:#222b38;
    padding:25px;
    box-sizing:border-box;
    border-radius:15px;
    text-align:center
}

input,button{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin:7px 0;
    font-size:18px;
    border-radius:8px;
    border:0
}

input{
    background:#111820;
    color:white;
    border:1px solid #667
}

button{
    background:#4285f4;
    color:white
}

#game{
    display:none;
    width:100%;
    height:100%
}

#info{
    margin-top:10px;
    padding:12px;
    background:#111820;
    border-radius:8px;
    word-break:break-all
}


/* TOUCH CONTROLS */

#controls{
    position:fixed;
    left:20px;
    bottom:20px;
    width:180px;
    height:180px;
    display:none;
    z-index:10
}

.key{
    position:absolute;
    width:58px;
    height:58px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.25);
    color:white;
    font-size:28px;
    font-weight:bold;
    user-select:none;
    touch-action:none
}

.key:active,
.key.down{
    background:rgba(80,150,255,.8)
}

#up{
    left:61px;
    top:0
}

#left{
    left:0;
    top:61px
}

#down{
    left:61px;
    top:61px
}

#right{
    left:122px;
    top:61px
}

@media (min-width:700px){

    #controls{
        left:30px;
        bottom:30px
    }

}
</style>
</head>

<body>


<!-- START MENU -->

<div id="menu">

<div class="box">

<h1>MINI WORLD</h1>

<p>
Enter the address of the P50 server.
</p>

<input
id="server"
placeholder="192.168.178.33:8080"
>

<button onclick="join()">
JOIN GAME
</button>

<div id="info">
Example: 192.168.178.33:8080
</div>

</div>

</div>


<!-- GAME -->

<canvas id="game"></canvas>


<!-- MOVEMENT BUTTONS -->

<div id="controls">

<button
class="key"
id="up">
▲
</button>

<button
class="key"
id="left">
◀
</button>

<button
class="key"
id="down">
▼
</button>

<button
class="key"
id="right">
▶
</button>

</div>


<script>

var canvas =
document.getElementById("game");

var ctx =
canvas.getContext("2d");

var menu =
document.getElementById("menu");

var info =
document.getElementById("info");

var controls =
document.getElementById("controls");

var socket = null;

var players = {};

var myId =
"Player" +
Math.floor(Math.random()*99999);

var myX = 0;

var myY = 0;

var keys = {};

var playing = false;



/* JOIN SERVER */

function join(){

    var address =
    document
    .getElementById("server")
    .value
    .trim();


    if(!address){

        info.innerHTML =
        "Please enter the P50 server address.";

        return;

    }


    info.innerHTML =
    "Connecting...";


    try{

        socket =
        new WebSocket(
            "ws://" + address
        );


        socket.onopen =
        function(){

            socket.send(
                JSON.stringify({
                    type:"join",
                    id:myId
                })
            );


            playing = true;


            menu.style.display =
            "none";


            canvas.style.display =
            "block";


            controls.style.display =
            "block";


            resize();

        };


        socket.onmessage =
        function(e){

            try{

                var data =
                JSON.parse(e.data);


                if(data.type === "state"){

                    players =
                    data.players;

                }

            }
            catch(x){}

        };


        socket.onerror =
        function(){

            info.innerHTML =
            "Could not connect. Check the address and Wi-Fi.";

        };


        socket.onclose =
        function(){

            playing = false;


            menu.style.display =
            "flex";


            canvas.style.display =
            "none";


            controls.style.display =
            "none";


            info.innerHTML =
            "Disconnected from server.";

        };

    }

    catch(x){

        info.innerHTML =
        "This browser cannot use WebSockets.";

    }

}



/* KEYBOARD */

document.onkeydown =
function(e){

    keys[
        e.key.toLowerCase()
    ] = true;

};


document.onkeyup =
function(e){

    keys[
        e.key.toLowerCase()
    ] = false;

};



/* TOUCH BUTTONS */

function hold(button,key){

    function start(e){

        e.preventDefault();

        keys[key] = true;

        button.classList.add("down");

    }


    function stop(e){

        e.preventDefault();

        keys[key] = false;

        button.classList.remove("down");

    }


    button.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );


    button.addEventListener(
        "touchend",
        stop,
        {passive:false}
    );


    button.addEventListener(
        "touchcancel",
        stop,
        {passive:false}
    );


    button.addEventListener(
        "mousedown",
        start
    );


    button.addEventListener(
        "mouseup",
        stop
    );


    button.addEventListener(
        "mouseleave",
        stop
    );

}


hold(
    document.getElementById("up"),
    "w"
);


hold(
    document.getElementById("down"),
    "s"
);


hold(
    document.getElementById("left"),
    "a"
);


hold(
    document.getElementById("right"),
    "d"
);



/* SEND MOVEMENT */

setInterval(
function(){

    if(
        !playing ||
        !socket ||
        socket.readyState !== 1
    ){

        return;

    }


    if(
        keys["w"] ||
        keys["arrowup"]
    ){

        myY -= 4;

    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){

        myY += 4;

    }


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){

        myX -= 4;

    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){

        myX += 4;

    }


    socket.send(
        JSON.stringify({
            type:"move",
            x:myX,
            y:myY
        })
    );

},
30
);



/* RESIZE */

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

window.onresize =
resize;



/* DRAW GAME */

function draw(){

    if(playing){

        ctx.fillStyle =
        "#18202a";


        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* GRID */

        ctx.strokeStyle =
        "#293747";


        var x;
        var y;


        for(
            x=-2000;
            x<2000;
            x+=50
        ){

            ctx.beginPath();


            ctx.moveTo(
                canvas.width/2+x,
                0
            );


            ctx.lineTo(
                canvas.width/2+x,
                canvas.height
            );


            ctx.stroke();

        }


        for(
            y=-2000;
            y<2000;
            y+=50
        ){

            ctx.beginPath();


            ctx.moveTo(
                0,
                canvas.height/2+y
            );


            ctx.lineTo(
                canvas.width,
                canvas.height/2+y
            );


            ctx.stroke();

        }



        /* PLAYERS */

        for(
            var id in players
        ){

            var p =
            players[id];


            var px =
            canvas.width/2 +
            p.x;


            var py =
            canvas.height/2 +
            p.y;


            ctx.beginPath();


            ctx.arc(
                px,
                py,
                18,
                0,
                Math.PI*2
            );


            ctx.fillStyle =
            (id === myId)
            ? "#55a0ff"
            : "#ffb84d";


            ctx.fill();


            ctx.fillStyle =
            "white";


            ctx.font =
            "14px Arial";


            ctx.textAlign =
            "center";


            ctx.fillText(
                id,
                px,
                py-25
            );

        }

    }


    requestAnimationFrame(draw);

}


resize();

draw();

</script>

</body>
</html>
